<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FFF6EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>糰糰夥伴</title>
<style>
:root{
  --bg:#FFF6EC;--card:#fff;--ink:#3A2E4A;--sub:#8E839C;--line:#F1E7DB;
  --pri:#FF7A59;--pri2:#FFA94D;--ok:#35B57A;--warn:#FF6B6B;
  --guard:#5B8DEF;--mech:#F2A23B;--harvest:#36B368;--kind:#F06A9B;--wise:#8C6CF0;
  --r:22px;--sh:0 8px 24px rgba(110,70,40,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#EDE3D6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:calc(88px + env(safe-area-inset-bottom));overflow-x:hidden}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(255,246,236,.92);backdrop-filter:blur(10px)}
.tb-pet{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;overflow:hidden}
.tb-pet svg{width:40px;height:40px}
.tb-info{flex:1;min-width:0}
.tb-name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-lv{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);margin-top:3px}
.xpbar{flex:1;height:6px;border-radius:6px;background:#F0E3D4;overflow:hidden;max-width:110px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--pri));border-radius:6px;transition:width .6s}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:6px 10px 6px 8px;font-weight:800;font-size:13px;box-shadow:var(--sh)}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.gear{width:36px;height:36px;border-radius:12px;background:#fff;box-shadow:var(--sh);display:grid;place-items:center}

/* ---------- nav ---------- */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(110,70,40,.06)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:700;color:#B3A8BF;position:relative}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--pri)}
.nav button.on:after{content:"";position:absolute;top:-8px;width:26px;height:4px;border-radius:4px;background:var(--pri)}
.nav .dot{position:absolute;top:3px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--warn);border:2px solid #fff}

/* ---------- generic ---------- */
.page{padding:0 16px 16px;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-top:14px}
.h{font-size:17px;font-weight:900;margin:22px 2px 4px;display:flex;align-items:center;gap:8px}
.h small{font-size:12px;color:var(--sub);font-weight:600;margin-left:auto}
.sub{color:var(--sub);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:16px;font-weight:800;font-size:15px;background:#F4ECE2;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;box-shadow:0 6px 16px rgba(255,122,89,.35)}
.btn.ok{background:var(--ok);color:#fff}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.4;box-shadow:none}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#F4ECE2;color:#7A6E88}
.chip{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:800;padding:2px 7px;border-radius:8px;background:#FFF4E6;color:#C26A2B}
.prog{height:10px;border-radius:10px;background:#F3E8DC;overflow:hidden}
.prog i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--pri2),var(--pri));transition:width .6s}

/* ---------- room ---------- */
.room{position:relative;height:310px;margin-top:6px;border-radius:30px;overflow:hidden;background:var(--wall,linear-gradient(#FFF1DE,#FFE5C8));box-shadow:var(--sh)}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:88px;background:repeating-linear-gradient(90deg,transparent 0 62px,rgba(120,70,30,.07) 62px 64px),linear-gradient(#EBCBA4,#DDB487);border-top:5px solid #D9AC7C}
.room .rug{position:absolute;left:50%;bottom:16px;width:220px;height:46px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(#FFD9C7 0 45%,#FFC4AB 46% 60%,#FFD9C7 61%);opacity:.85}
.window{position:absolute;left:22px;top:22px;width:98px;height:82px;border-radius:16px;border:6px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.08);overflow:hidden;background:var(--sky)}
.window:before,.window:after{content:"";position:absolute;background:#fff}
.window:before{left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%)}
.window:after{top:50%;left:0;right:0;height:4px;transform:translateY(-50%)}
.window .orb{position:absolute;right:12px;top:10px;width:24px;height:24px;border-radius:50%}
.window .cloud{position:absolute;left:8px;bottom:12px;width:34px;height:12px;border-radius:12px;background:rgba(255,255,255,.85);animation:cloud 14s linear infinite}
@keyframes cloud{from{transform:translateX(-30px)}to{transform:translateX(100px)}}
.deco{position:absolute;line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.12));transition:transform .2s}
.deco.wall{right:28px;top:30px;font-size:46px}
.deco.left{left:18px;bottom:58px;font-size:60px}
.deco.right{right:18px;bottom:58px;font-size:52px}
.deco.flag{left:136px;top:24px;font-size:34px}
.pet-wrap{position:absolute;left:50%;bottom:18px;width:210px;height:210px;transform:translateX(-50%);cursor:pointer;z-index:3}
.pet-wrap svg{width:100%;height:100%;overflow:visible}
.speech{position:absolute;left:50%;top:26px;transform:translateX(-50%) scale(.6);opacity:0;background:#fff;border-radius:18px;padding:9px 14px;font-size:14px;font-weight:700;box-shadow:var(--sh);white-space:nowrap;transition:.25s;z-index:5;pointer-events:none}
.speech.on{opacity:1;transform:translateX(-50%) scale(1)}
.speech:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.need{position:absolute;left:calc(50% + 62px);top:96px;z-index:4;background:#fff;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;font-size:22px;box-shadow:var(--sh);animation:float 2s ease-in-out infinite}
.need:before{content:"";position:absolute;left:-8px;bottom:-4px;width:12px;height:12px;border-radius:50%;background:#fff}
@keyframes float{50%{transform:translateY(-6px)}}
.dust{position:absolute;bottom:22px;font-size:20px;opacity:.55;z-index:4;animation:float 3s ease-in-out infinite}
.zzz{position:absolute;left:calc(50% + 40px);top:80px;z-index:4;font-weight:900;color:#7C83C9;font-size:22px;animation:zzz 2.4s ease-in infinite}
@keyframes zzz{0%{opacity:0;transform:translate(0,10px) scale(.6)}40%{opacity:1}100%{opacity:0;transform:translate(24px,-30px) scale(1.2)}}
.room.night:after{content:"";position:absolute;inset:0;background:rgba(30,30,80,.18);pointer-events:none}
.fx{position:absolute;pointer-events:none;z-index:6;font-size:24px;animation:rise 1.2s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1;transform:translateY(-10px) scale(1.1)}100%{opacity:0;transform:translateY(-90px) scale(1)}}

/* pet svg animation */
.pet-svg .body{transform-box:fill-box;transform-origin:50% 100%;animation:idle 2.6s ease-in-out infinite}
.pet-svg.sad .body{animation-duration:4s}
.pet-svg.sleep .body{animation:breath 3.6s ease-in-out infinite}
.pet-svg .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.pet-svg .bulb{animation:bulb 1.4s infinite}
.pet-svg .star{animation:twinkle 1.8s infinite}
.pet-svg .star:nth-child(2n){animation-delay:.6s}
.pet-svg.egg .body{animation:wobble 3s ease-in-out infinite}
@keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes bulb{50%{opacity:.35}}
@keyframes twinkle{50%{opacity:.2}}
@keyframes wobble{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-6deg)}84%{transform:rotate(5deg)}92%{transform:rotate(-3deg)}}
.pet-wrap.jump .body{animation:jump .7s ease-out}
@keyframes jump{0%{transform:scale(1.1,.85)}35%{transform:translateY(-38px) scale(.95,1.06)}70%{transform:translateY(0) scale(1.1,.88)}100%{transform:scale(1,1)}}
.pet-wrap.eat .body{animation:eat .35s 3}
@keyframes eat{50%{transform:scale(1.06,.92)}}
.sil{filter:grayscale(1) brightness(1.15) opacity(.55)}

/* stats & actions */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.stat{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800}
.stat .ic{font-size:18px;width:24px;text-align:center}
.stat .bar{flex:1;height:10px;border-radius:10px;background:#F3E8DC;overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:10px;transition:width .6s}
.stat.low .bar{animation:lowpulse 1.2s infinite}
@keyframes lowpulse{50%{box-shadow:0 0 0 3px rgba(255,107,107,.25)}}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;position:relative}
.act .o{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;font-size:27px;background:#fff;box-shadow:var(--sh);transition:transform .12s}
.act:active .o{transform:scale(.9)}
.act:disabled{opacity:.4}
.act .badge{position:absolute;top:-4px;right:calc(50% - 36px);background:var(--pri);color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.cta{display:flex;align-items:center;gap:14px;cursor:pointer}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),#F3E8DC 0);display:grid;place-items:center;flex:none}
.ring b{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:13px;font-weight:900}
.cta .t{flex:1}
.cta .t b{font-size:16px}
.arrow{font-size:20px;color:var(--sub)}
.grad{background:linear-gradient(135deg,#FFE3A3,#FFC5A8);border:2px dashed #FF9E6E}

/* tasks */
.tsum{display:flex;gap:10px;margin-top:12px}
.tsum .box{flex:1;background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px;text-align:center}
.tsum .box b{display:block;font-size:22px;font-weight:900}
.tsum .box span{font-size:11px;color:var(--sub);font-weight:700}
.task{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;box-shadow:var(--sh);padding:14px;margin-top:10px;cursor:pointer;transition:transform .12s;position:relative;overflow:hidden}
.task:active{transform:scale(.98)}
.task .ai{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none}
.task .tt{flex:1;min-width:0}
.task .tt b{display:block;font-size:15px}
.task .rw{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.task .st{flex:none;font-size:12px;font-weight:800;padding:8px 12px;border-radius:12px;background:#FFF0E8;color:var(--pri)}
.task.done{opacity:.72}
.task.done .st{background:#E6F7EE;color:var(--ok)}
.task.done b{text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.task .core{position:absolute;top:0;left:0;font-size:10px;font-weight:900;color:#fff;background:var(--pri);padding:2px 8px;border-radius:0 0 10px 0}
.chest{text-align:center;background:linear-gradient(135deg,#FFF3C4,#FFD9B8)}
.chest .big{font-size:64px;display:inline-block;animation:shake 1.4s infinite}
@keyframes shake{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-10deg)}80%{transform:rotate(10deg)}90%{transform:rotate(-5deg)}}

/* sheet */
.mask{position:fixed;inset:0;background:rgba(40,25,50,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;max-height:88vh;overflow:auto;z-index:51;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.9,.3,1.1)}
.sheet:not(.on){visibility:hidden;transition:transform .32s,visibility 0s .32s}
.sheet.on{transform:translate(-50%,0)}
.sheet .grip{width:44px;height:5px;border-radius:5px;background:#E2D5C6;margin:0 auto 14px}
.sheet h3{margin:4px 0 6px;font-size:20px}
.chk{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:14px;margin-top:10px;font-weight:700;box-shadow:var(--sh);cursor:pointer}
.chk input{appearance:none;width:24px;height:24px;border-radius:8px;border:2.5px solid #DCCFC0;display:grid;place-items:center;flex:none;margin:0}
.chk input:checked{background:var(--ok);border-color:var(--ok)}
.chk input:checked:after{content:"✓";color:#fff;font-weight:900;font-size:15px}
.photo{display:block;margin-top:12px;border:2.5px dashed #E2D2BF;border-radius:20px;background:#fff;min-height:170px;display:grid;place-items:center;text-align:center;color:var(--sub);font-weight:700;cursor:pointer;overflow:hidden}
.photo img{width:100%;max-height:260px;object-fit:cover;display:block}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:18px 0}
.stepper button{width:56px;height:56px;border-radius:18px;background:#fff;box-shadow:var(--sh);font-size:26px;font-weight:900}
.stepper b{font-size:40px;min-width:90px;text-align:center}
.opt{display:block;width:100%;text-align:left;background:#fff;border-radius:16px;padding:14px 16px;margin-top:10px;font-weight:700;box-shadow:var(--sh);border:2.5px solid transparent}
.opt.right{border-color:var(--ok);background:#E9F8F0}
.opt.wrong{border-color:var(--warn);background:#FFECEC}
.row{display:flex;gap:10px;margin-top:16px}
.field{display:block;margin-top:14px}
.field span{display:block;font-size:13px;font-weight:800;color:var(--sub);margin-bottom:6px}
.field input,.field select{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:#fff;outline:none}
.field input:focus,.field select:focus{border-color:var(--pri2)}
.seg{display:flex;background:#F2E8DC;border-radius:14px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:800;font-size:14px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}

/* overlay */
.ov{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(255,236,190,.97),rgba(255,190,150,.97));animation:fade .3s;padding:24px;text-align:center}
.ov .inner{max-width:360px}
.ov h2{font-size:26px;margin:10px 0 6px}
.ov .pet{width:220px;height:220px;margin:0 auto;position:relative}
.ov .pet svg{width:100%;height:100%;overflow:visible}
.ov .rays{position:absolute;inset:-50px;background:repeating-conic-gradient(rgba(255,255,255,.55) 0 10deg,transparent 10deg 24deg);border-radius:50%;animation:spin 12s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.ov .flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{filter:brightness(4) saturate(0)}60%{filter:brightness(2.2) saturate(.3)}100%{filter:none}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:71;border-radius:3px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* toast */
.toasts{position:fixed;top:calc(68px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;width:calc(100% - 32px);max-width:440px;pointer-events:none}
.toast{background:rgba(58,46,74,.94);color:#fff;padding:11px 16px;border-radius:16px;font-weight:700;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.18);animation:tin .3s,tout .3s 2.4s forwards;text-align:center}
.toast.gold{background:linear-gradient(135deg,#FFB547,#FF7A59)}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}}
@keyframes tout{to{opacity:0;transform:translateY(-12px)}}

/* store */
.plaza{position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(#CFEAFF 0 38%,#BFE6B5 38%);box-shadow:var(--sh);padding:62px 10px 14px;margin-top:12px}
.plaza .sign{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:6px 14px;font-weight:900;font-size:14px;box-shadow:var(--sh);white-space:nowrap}
.plaza .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mate{text-align:center;cursor:pointer;padding:4px 0 8px;border-radius:18px;transition:background .2s}
.mate:active{background:rgba(255,255,255,.4)}
.mate .p{width:84px;height:84px;margin:0 auto}
.mate .p svg{width:100%;height:100%;overflow:visible}
.mate .n{font-size:12px;font-weight:900;background:rgba(255,255,255,.9);display:inline-block;padding:2px 9px;border-radius:999px;margin-top:-4px}
.mate .s{font-size:10px;font-weight:800;color:#4D7A45;margin-top:3px}
.mate.me .n{background:var(--pri);color:#fff}
.lb{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.lb:last-child{border:0}
.lb .rk{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:13px;background:#F4ECE2}
.lb.top1 .rk{background:#FFD45C}.lb.top2 .rk{background:#E3E6EE}.lb.top3 .rk{background:#F5C9A3}
.lb .nm{flex:1;font-weight:800;font-size:14px}
.lb.mine{background:#FFF1E8;border-radius:14px;padding:10px}
.lb .pc{font-weight:900;color:var(--pri)}

/* claw machine */
.cm{background:linear-gradient(160deg,#FF8F70,#FF6FA0);border-radius:30px;padding:12px;box-shadow:0 12px 30px rgba(255,111,130,.35);margin-top:12px}
.cm-top{display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:900;font-size:17px;letter-spacing:2px;padding:4px 0 10px}
.cm-top .lights{display:flex;gap:6px}
.cm-top .lights i{width:8px;height:8px;border-radius:50%;background:#FFF3A0;animation:bulb 1s infinite}
.cm-top .lights i:nth-child(2n){animation-delay:.5s}
.glass{position:relative;height:240px;border-radius:20px;background:linear-gradient(#E9F6FF,#D3ECFF);overflow:hidden;border:4px solid rgba(255,255,255,.75)}
.glass:before{content:"";position:absolute;top:0;left:12%;width:16%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-14deg);z-index:6;pointer-events:none}
.rail{position:absolute;top:10px;left:6px;right:6px;height:6px;border-radius:6px;background:#9BB3CC}
.claw{position:absolute;top:10px;width:46px;margin-left:-23px;z-index:4;display:flex;flex-direction:column;align-items:center}
.claw .cable{width:3px;background:#7F93A8;height:0}
.claw svg{width:46px;height:40px;margin-top:-2px}
.claw .held{position:absolute;bottom:-26px;font-size:30px}
.prize{position:absolute;bottom:12px;width:44px;height:44px;margin-left:-22px;border-radius:50%;display:grid;place-items:center;font-size:24px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08),0 3px 6px rgba(0,0,0,.08);transition:transform .3s}
.prize.wig{animation:wig .4s}
@keyframes wig{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.chute{position:absolute;left:0;bottom:0;width:62px;height:64px;background:rgba(255,255,255,.6);border-radius:0 18px 0 0;border:3px solid rgba(255,255,255,.9);border-left:0;border-bottom:0;z-index:5;display:grid;place-items:center;font-size:11px;font-weight:900;color:#7F93A8}
.cm-panel{display:flex;align-items:center;gap:10px;margin-top:12px}
.cm-panel .info{flex:1;color:#fff;font-weight:800;font-size:13px;line-height:1.4}
.cm-btn{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF27A,#FFC21A);box-shadow:0 7px 0 #D69A00,0 10px 18px rgba(0,0,0,.2);font-weight:900;font-size:16px;color:#7A4A00;transition:transform .08s,box-shadow .08s}
.cm-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #D69A00}
.cm-btn:disabled{filter:grayscale(.6);opacity:.7}

/* shop & dex */
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.item{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:12px 6px;text-align:center;cursor:pointer;position:relative;border:2.5px solid transparent}
.item .e{font-size:38px;height:48px;display:grid;place-items:center}
.item .sw{width:44px;height:44px;border-radius:14px;margin:2px auto;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.item .nm{font-size:12px;font-weight:800;margin-top:4px}
.item .pr{font-size:12px;font-weight:900;color:#C26A2B;margin-top:3px}
.item.own .pr{color:var(--ok)}
.item.eq{border-color:var(--pri)}
.item.eq:after{content:"使用中";position:absolute;top:-8px;right:-4px;font-size:10px;font-weight:900;background:var(--pri);color:#fff;padding:2px 7px;border-radius:8px}
.tabs{display:flex;gap:8px;margin-top:14px;overflow-x:auto}
.tabs button{padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px;background:#fff;box-shadow:var(--sh);white-space:nowrap;color:var(--sub)}
.tabs button.on{background:var(--ink);color:#fff}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.dex .d{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:8px 6px 12px;text-align:center;cursor:pointer}
.dex .d .p{width:86px;height:86px;margin:0 auto}
.dex .d .p svg{width:100%;height:100%;overflow:visible}
.dex .d b{display:block;font-size:13px}
.dex .d span{font-size:10px;font-weight:800;color:var(--sub)}
.ach{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.ach:last-child{border:0}
.ach .ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:22px;background:#F4ECE2;flex:none}
.ach.got .ic{background:linear-gradient(135deg,#FFE08A,#FFB86B)}
.ach .tx{flex:1}
.ach .tx b{font-size:14px}
.ach .tx div{font-size:12px;color:var(--sub)}
.ach:not(.got){opacity:.55}
.attrs{display:grid;gap:8px}
.attr{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800}
.attr .bar{flex:1;height:9px;background:#F3E8DC;border-radius:9px;overflow:hidden}
.attr .bar i{display:block;height:100%;border-radius:9px}

/* onboarding */
.onb{min-height:100vh;min-height:100dvh;padding:calc(30px + env(safe-area-inset-top)) 24px 30px;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 18%,#FFE3C4,var(--bg) 60%)}
.onb .logo{text-align:center;margin-top:10px}
.onb .logo .p{width:150px;height:150px;margin:0 auto}
.onb .logo .p svg{width:100%;height:100%;overflow:visible}
.onb h1{font-size:30px;margin:6px 0 4px;letter-spacing:2px}
.onb .grow{flex:1}
</style>
</head>

const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ let a=hash(String(seed)); return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr,r=Math.random){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255; const t=amt<0?0:255, p=Math.abs(amt); r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b); return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
const need = lv => 40 + lv*20;
const vibrate = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

let actx=null;
function beep(notes){
  if(!S || !S.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    notes.forEach(([f,d,type='sine'])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+.02); t+=d*.8;
    });
  }catch(e){}
}

const fxQueue=[]; let ovOpen=false;
function queue(fn){ fxQueue.push(fn); }
function runQueue(){ if(ovOpen || !fxQueue.length) return; fxQueue.shift()(); }

/* 時間衰減：寵物不會死，最低只會到 0 並變得沒精神 */
function tick(){
  const now=Date.now(), h=Math.max(0,(now-S.lastTick)/36e5); S.lastTick=now;
  const p=S.pet; if(p.stage===0 || h<=0) return h;
  const st=p.stats;
  st.food=clamp(st.food-5*h); st.fun=clamp(st.fun-4*h); st.clean=clamp(st.clean-3*h);
  if(p.sleeping){ st.energy=clamp(st.energy+25*h); if(st.energy>=100) p.sleeping=false; }
  else st.energy=clamp(st.energy-3*h);
  return h;
}
function moodOf(){
  const p=S.pet; if(p.stage===0) return 'egg'; if(p.sleeping) return 'sleep';
  const s=p.stats, m=Math.min(s.food,s.fun,s.clean), avg=(s.food+s.fun+s.clean)/3;
  if(m<25) return 'sad'; if(avg>=80) return 'joy'; if(avg>=55) return 'happy'; return 'normal';
}
function needOf(){
  const p=S.pet; if(p.stage===0||p.sleeping) return null; const s=p.stats;
  const list=[['food','🍙'],['clean','🫧'],['fun','🎾'],['energy','💤']].filter(([k])=>s[k]<35).sort((a,b)=>s[a[0]]-s[b[0]]);
  return list.length?list[0][1]:null;
}

function genTasks(k){
  const sh=S.user.shift, r=rng(k+'|'+S.user.uid+'|'+sh);
  const core=CORE[sh];
  const pool=TASKS.filter(t=>!core.includes(t.code) && t.code!=='DAILY_QUIZ' && (t.shift==='any'||t.shift===sh||sh==='full'));
  shuffle(pool,r);
  return [...core,'DAILY_QUIZ',...pool.slice(0, sh==='full'?3:2).map(t=>t.code)];
}
function today(){
  const k=dkey(); let d=S.days[k];
  if(!d){
    d=S.days[k]={tasks:genTasks(k).map(code=>({code,done:false,n:0})), chest:false, shift:S.user.shift};
    const keys=Object.keys(S.days).sort(); while(keys.length>14) delete S.days[keys.shift()];
    save();
  }
  return d;
}
const isCore = code => CORE[today().shift||S.user.shift].includes(code);
function quizToday(){ return QUIZ[hash(dkey()+S.user.uid)%QUIZ.length]; }

function completeTask(code, opt={}){
  const d=today(), t=d.tasks.find(x=>x.code===code), def=TASK_MAP[code];
  if(!t || t.done || !def) return false;
  const m=opt.half?.5:1, xp=Math.round(def.xp*m), food=Math.max(1,Math.round(def.food*m)), coin=Math.round(def.coin*m);
  t.done=true; t.at=Date.now(); if(opt.photo) t.photo=opt.photo; if(def.verify==='photo') t.pending=true; if(opt.external) t.external=true;
  S.food+=food; S.coins+=coin; S.totalTasks++; S.pet.tasks++;
  S.pet.attrs[def.attr]+=xp; S.attrTotal[def.attr]+=xp;
  const wk=weekStart(); S.week[wk]=(S.week[wk]||0)+1;
  if(S.pet.stage===0) S.pet.hatch++;
  addXP(xp);
  updateStreak();
  checkAch();
  save();
  emit('mochi:taskCompleted',{code, at:t.at, uid:S.user.uid});
  SFX.ok(); vibrate(20);
  toast(`完成「${def.title}」 +${xp} 經驗　🍙+${food}　🪙+${coin}`, 'gold');
  bumpPills();
  render(); runQueue();
  return true;
}

function addXP(n){
  const p=S.pet; if(p.level>=CONFIG.maxLevel) return;
  n=Math.round(n*(1+Math.min(.5,(S.generation-1)*.1)));
  p.xp+=n;
  while(p.level<CONFIG.maxLevel && p.xp>=need(p.level)){ p.xp-=need(p.level); p.level++; const lv=p.level; queue(()=>levelUp(lv)); }
  if(p.level>=CONFIG.maxLevel) p.xp=0;
  checkEvolve();
}
function careXP(n){
  if(S.care.date!==dkey()) S.care={date:dkey(),xp:0};
  const g=Math.min(n, CONFIG.careXpPerDay-S.care.xp); if(g<=0) return;
  S.care.xp+=g; addXP(g);
}
function dominant(attrs){ return Object.entries(attrs).sort((a,b)=>b[1]-a[1])[0][0]; }
function adultForm(){
  if(S.streak>=21) return 'a_meteor';
  const v=Object.values(S.pet.attrs), mx=Math.max(...v), mn=Math.min(...v);
  if(mn>0 && (mx-mn)/mx<.3) return 'a_rainbow';
  return 'a_'+dominant(S.pet.attrs);
}
function checkEvolve(){
  const p=S.pet; let to=null;
  if(p.stage===0 && p.hatch>=3) to='mochi';
  else if(p.stage===1 && p.level>=5) to='c_'+dominant(p.attrs);
  else if(p.stage===2 && p.level>=12) to=adultForm();
  if(!to) return;
  const from=p.form; p.form=to; p.stage=FORMS[to].stage;
  if(p.stage===1){ p.stats={food:75,fun:85,clean:90,energy:90}; S.lastTick=Date.now(); }
  if(!S.seen.includes(to)) S.seen.push(to);
  fxQueue.unshift(()=>evolveFx(from,to));
  checkEvolve();
}
function updateStreak(){
  const d=today(), k=dkey();
  const coreDone=d.tasks.filter(t=>isCore(t.code)).every(t=>t.done);
  if(!coreDone || S.lastStreakDate===k) return;
  if(!S.lastStreakDate) S.streak=1;
  else{
    const miss=daysBetween(S.lastStreakDate,k)-1;
    if(miss<=0) S.streak++;
    else if(miss<=S.protect){ S.protect-=miss; S.streak++; toast(`🛡️ 使用 ${miss} 張休假保護卡，連續紀錄保住了！`); }
    else S.streak=1;
  }
  S.lastStreakDate=k;
  if(S.streak>1) toast(`🔥 連續 ${S.streak} 天完成核心任務！`);
}
function dailyRollover(){
  if(S.protectMonth!==mkey()){ S.protectMonth=mkey(); S.protect=2; }
  if(S.lastStreakDate){ const miss=daysBetween(S.lastStreakDate,dkey())-1; if(miss>S.protect) S.streak=0; }
}
function checkAch(){
  ACH.forEach(a=>{
    if(S.ach[a.id] || !a.test(S)) return;
    S.ach[a.id]=Date.now(); S.coins+=30;
    if(!S.title) S.title=a.title;
    queue(()=>{ toast(`🏆 成就達成「${a.name}」　獲得稱號「${a.title}」　🪙+30`,'gold'); SFX.level(); runQueueLater(); });
  });
}
function runQueueLater(){ setTimeout(runQueue,600); }

function say(text){
  const el=$('#speech'); if(!el) return;
  if(!text){ const h=new Date().getHours(); const m=moodOf(); const pool=m==='sad'?LINES.sad:[...LINES.any,...(h<12?LINES.morning:h>=18?LINES.night:[])]; text=pool[Math.floor(Math.random()*pool.length)]; }
  el.textContent=text; el.classList.add('on'); clearTimeout(say.t); say.t=setTimeout(()=>el.classList.remove('on'),2200);
}
function fx(emoji, n=1, spread=60){
  const room=$('.room'); if(!room) return;
  for(let i=0;i<n;i++){ const e=document.createElement('div'); e.className='fx'; e.textContent=emoji;
    e.style.left=`calc(50% + ${(Math.random()-.5)*spread*2}px)`; e.style.bottom=`${120+Math.random()*60}px`; e.style.animationDelay=`${i*.12}s`;
    room.appendChild(e); setTimeout(()=>e.remove(),1600+i*120); }
}
function petAnim(cls,ms=700){ const w=$('#petWrap'); if(!w) return; w.classList.remove(cls); void w.offsetWidth; w.classList.add(cls); setTimeout(()=>w.classList.remove(cls),ms); }
function care(kind){
  const p=S.pet, st=p.stats; tick();
  if(p.stage===0){ toast('還是一顆蛋喔，先去完成任務讓牠孵化吧！'); return; }
  if(p.sleeping && kind!=='sleep'){ toast('噓…牠正在睡覺，先叫醒牠吧'); return; }
  if(kind==='feed'){
    if(S.food<=0){ toast('飼料用完了！完成任務可以獲得 🍙'); SFX.fail(); return; }
    if(st.food>=96){ say('吃不下了啦～'); return; }
    S.food--; st.food=clamp(st.food+28); careXP(3); transientMood='eat'; renderPet(); petAnim('eat',1100); fx('🍙'); say('好好吃！'); SFX.pop();
    setTimeout(()=>{transientMood=null; renderPet();},1200);
  }else if(kind==='clean'){
    if(st.clean>=95){ say('已經很乾淨囉！'); return; }
    st.clean=100; careXP(3); fx('🫧',6,80); say('洗香香～'); SFX.pop();
  }else if(kind==='play'){
    if(st.energy<15){ say('好累…想睡覺'); return; }
    st.fun=clamp(st.fun+25); st.energy=clamp(st.energy-12); careXP(3); petAnim('jump'); fx('✨',3); say('好好玩！再一次！'); SFX.tap();
  }else if(kind==='sleep'){
    p.sleeping=!p.sleeping; SFX.tap();
  }
  vibrate(10); save();
  if(kind==='sleep'){ render(); say(p.sleeping?'晚安…':'早安！精神飽滿！'); } else refreshLight();
  runQueue();
}

function refreshLight(){
  const p=S.pet, pills=document.querySelectorAll('.pill');
  if(pills.length){ pills[0].textContent='🍙 '+S.food; pills[1].textContent='🪙 '+S.coins; pills[2].textContent='🔥 '+S.streak; }
  setEl('#shopCoins','textContent','🪙 '+S.coins);
  const xb=document.querySelector('.xpbar i'); if(xb) xb.style.width=(p.level>=CONFIG.maxLevel?100:Math.round(p.xp/need(p.level)*100))+'%';
  const lv=document.querySelector('.tb-lv b'); if(lv) lv.textContent='Lv.'+p.level;
  const st=$('#stats'); if(st){ st.querySelectorAll('.stat').forEach((el,i)=>{ const k=['food','fun','clean','energy'][i]; el.querySelector('.bar i').style.width=Math.round(p.stats[k])+'%'; el.classList.toggle('low',p.stats[k]<30); }); }
  const bd=document.querySelector('[data-care="feed"] .badge'); if(bd) bd.textContent=S.food;
  const nd=document.querySelector('.need'), n=needOf(); if(nd){ if(n) nd.textContent=n; else nd.remove(); }
  if(p.stats.clean>=40) document.querySelectorAll('.dust').forEach(d=>d.remove());
}

function gearPath(cx,cy,r,teeth=8){
  let d=''; const ro=r, ri=r*.72;
  for(let i=0;i<teeth*2;i++){ const a=Math.PI*i/teeth, rr=i%2?ri:ro; const a1=a-Math.PI/teeth/2.2, a2=a+Math.PI/teeth/2.2;
    d+=(i?'L':'M')+(cx+rr*Math.cos(a1)).toFixed(1)+' '+(cy+rr*Math.sin(a1)).toFixed(1)+'L'+(cx+rr*Math.cos(a2)).toFixed(1)+' '+(cy+rr*Math.sin(a2)).toFixed(1); }
  return d+'Z';
}

function toast(msg, cls=''){ const t=document.createElement('div'); t.className='toast '+cls; t.textContent=msg; $('#toasts').appendChild(t); setTimeout(()=>t.remove(),2800); }
function bumpPills(){ document.querySelectorAll('.pill').forEach(p=>{p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump');}); }
function openSheet(html){ const s=$('#sheet'); s.innerHTML='<div class="grip"></div>'+html; $('#mask').classList.add('on'); s.classList.add('on'); }
function closeSheet(){ $('#mask').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#mask').onclick=closeSheet;
function overlay(html, onClose){
  ovOpen=true; const o=document.createElement('div'); o.className='ov'; o.innerHTML=`<div class="inner">${html}</div>`; document.body.appendChild(o);
  const close=()=>{ o.remove(); ovOpen=false; onClose&&onClose(); render(); setTimeout(runQueue,250); };
  o.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  return o;
}
function confetti(n=40){ const cols=['#FF7A59','#FFC94D','#5B8DEF','#36B368','#F06A9B','#8C6CF0'];
  for(let i=0;i<n;i++){ const c=document.createElement('div'); c.className='confetti'; c.style.left=Math.random()*100+'vw'; c.style.background=cols[i%cols.length];
    c.style.animationDuration=(1.8+Math.random()*1.6)+'s'; c.style.animationDelay=Math.random()*.5+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),4000); } }
function levelUp(lv){
  SFX.level(); vibrate([20,40,20]);
  overlay(`<div class="pet"><div class="rays"></div>${petSVG(S.pet.form,{mood:'joy',hatch:S.pet.hatch})}</div><h2>升級！Lv.${lv}</h2><p class="sub">${esc(S.pet.name)} 變得更有精神了</p>${nextGoal()}<button class="btn pri block" data-close style="margin-top:18px">太棒了</button>`);
}
function nextGoal(){ const p=S.pet; if(p.stage===1) return `<p class="sub">Lv.5 將進入幼年期（${p.level}/5）</p>`; if(p.stage===2) return `<p class="sub">Lv.12 將進入成熟期（${p.level}/12）</p>`; if(p.level>=CONFIG.maxLevel) return `<p class="sub">已達最高等級，可以舉行畢業典禮了！</p>`; return ''; }
function evolveFx(from,to){
  SFX.level(); vibrate([30,60,30,60,60]); confetti(60);
  const hatch = from==='egg';
  const o=overlay(`<div class="pet"><div class="rays"></div><div id="evoPet">${petSVG(from,{mood:'happy',hatch:3})}</div></div>
    <h2 id="evoTitle">${hatch?'蛋好像要裂開了…':'咦？'+esc(S.pet.name)+' 的樣子…'}</h2><p class="sub" id="evoSub">&nbsp;</p>
    <button class="btn pri block hidden" id="evoBtn" data-close style="margin-top:18px">好可愛！</button>`);
  setTimeout(()=>{ const ep=o.querySelector('#evoPet'); ep.innerHTML=petSVG(to,{mood:'joy'}); ep.classList.add('flash');
    o.querySelector('#evoTitle').textContent = hatch?`${S.pet.name} 孵化了！`:`進化成「${FORMS[to].name}」！`;
    o.querySelector('#evoSub').textContent = hatch?'記得餵食、清潔、陪牠玩喔':`${['','','幼年期','成熟期'][FORMS[to].stage]}・圖鑑已登錄`;
    o.querySelector('#evoBtn').classList.remove('hidden'); SFX.ok(); }, 1800);
}

function openTask(code){
  const def=TASK_MAP[code], t=today().tasks.find(x=>x.code===code), a=ATTR[def.attr];
  const head=`<div style="display:flex;align-items:center;gap:12px"><div class="task" style="margin:0;padding:0;box-shadow:none;background:none"><div class="ai" style="background:${a.bg}">${a.icon}</div></div><div><h3>${def.title}</h3><span class="tag">${a.name}屬性</span> ${isCore(code)?'<span class="tag" style="background:#FFE7DE;color:var(--pri)">核心任務</span>':''}</div></div><p class="sub" style="margin-top:12px;font-size:14px">${def.desc}</p>`;
  if(t.done){
    openSheet(head+`<div class="card" style="text-align:center"><div style="font-size:40px">✅</div><b>已完成</b><p class="sub">${new Date(t.at).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})} 完成${t.pending?'・等待店長確認':''}${t.external?'・由店務系統同步':''}</p>${t.photo?`<img src="${t.photo}" style="width:100%;border-radius:14px;margin-top:8px">`:''}</div><button class="btn block" style="margin-top:14px" id="cls">關閉</button>`);
    $('#cls').onclick=closeSheet; return;
  }
  const finish=(opt)=>{ closeSheet(); setTimeout(()=>completeTask(code,opt),280); };
  if(def.verify==='check'){
    openSheet(head+def.items.map(it=>`<label class="chk"><input type="checkbox"><span>${it}</span></label>`).join('')+`<button class="btn pri block" id="doneBtn" disabled style="margin-top:18px">完成任務</button>`);
    const boxes=[...document.querySelectorAll('#sheet input[type=checkbox]')];
    boxes.forEach(b=>b.onchange=()=>{ SFX.tap(); vibrate(6); $('#doneBtn').disabled=!boxes.every(x=>x.checked); });
    $('#doneBtn').onclick=()=>finish({});
  }else if(def.verify==='photo'){
    let photo=null;
    openSheet(head+`<label class="photo"><input type="file" accept="image/*" capture="environment" id="photoIn" hidden><div id="prev">📷<br>點此拍照或選擇照片</div></label><p class="sub" style="text-align:center">照片會送給店長確認</p><button class="btn pri block" id="doneBtn" disabled style="margin-top:12px">上傳並完成</button>`);
    $('#photoIn').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ photo=await thumb(f); $('#prev').innerHTML=`<img src="${photo}">`; $('#doneBtn').disabled=false; }catch(err){ toast('照片讀取失敗，請再試一次'); } };
    $('#doneBtn').onclick=()=>finish({photo});
  }else if(def.verify==='count'){
    let n=t.n||0;
    openSheet(head+`<div class="stepper"><button id="minus">−</button><b id="cnt">${n}</b><button id="plus">＋</button></div><p class="sub" style="text-align:center">目標 ${def.target} ${def.unit}</p><button class="btn pri block" id="doneBtn" ${n>=def.target?'':'disabled'} style="margin-top:12px">完成任務</button>`);
    const upd=()=>{ $('#cnt').textContent=n; $('#doneBtn').disabled=n<def.target; t.n=n; save(); };
    $('#plus').onclick=()=>{ n=Math.min(def.target,n+1); SFX.tap(); vibrate(6); upd(); };
    $('#minus').onclick=()=>{ n=Math.max(0,n-1); upd(); };
    $('#doneBtn').onclick=()=>finish({});
  }else if(def.verify==='quiz'){
    const q=quizToday();
    openSheet(head+`<div class="card"><b style="font-size:16px">Q. ${q.q}</b></div>${q.a.map((x,i)=>`<button class="opt" data-i="${i}">${'ABC'[i]}. ${x}</button>`).join('')}<div id="qres"></div>`);
    document.querySelectorAll('#sheet .opt').forEach(b=>b.onclick=()=>{

function thumb(file){ return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);

function shopItem(id){

const PRIZES=[{k:'food',e:'🍙',bg:'#FFE9CC',w:30},{k:'coin',e:'🪙',bg:'#FFF3B8',w:25},{k:'xp',e:'⭐',bg:'#E7E0FF',w:20},{k:'item',e:'🎁',bg:'#FFD9E6',w:25}];
function pickPrize(){ let r=Math.random()*100; for(const p of PRIZES){ if((r-=p.w)<0) return p; } return PRIZES[0]; }
function setupClaw(){
  const glass=$('#glass'); if(!glass) return;
  claw={busy:false,phase:'idle',x:50,t:0,raf:null,prizes:[]};
  const xs=[32,48,64,80]; shuffle(xs);
  claw.prizes=xs.slice(0,3).map(x=>({x,...pickPrize()}));
  $('#prizes').innerHTML=claw.prizes.map((p,i)=>`<div class="prize" id="pz${i}" style="left:${p.x}%;background:${p.bg}">${p.e}</div>`).join('');
  $('#cmBtn').onclick=clawPress;
}
function setClaw(x,drop,open=1){ const c=$('#claw'); if(!c) return; c.style.left=x+'%'; $('#cable').style.height=drop+'px';
  const a=(1-open)*16; $('#clawL').setAttribute('transform',`rotate(${-a} 17 9)`); $('#clawR').setAttribute('transform',`rotate(${a} 29 9)`); }
const setEl=(sel,prop,val)=>{ const e=$(sel); if(e) e[prop]=val; };
const tween=(ms,fn)=>new Promise(res=>{ const t0=performance.now(); const f=t=>{ const k=Math.min(1,(t-t0)/ms); fn(k); k<1?requestAnimationFrame(f):res(); }; requestAnimationFrame(f); });
function clawPress(){
  const btn=$('#cmBtn');
  if(claw.phase==='idle'){
    if(S.coins<CONFIG.clawCost){ toast('金幣不夠喔！完成任務可以賺金幣'); SFX.fail(); return; }
    S.coins-=CONFIG.clawCost; save(); bumpPills(); refreshLight();
    claw.phase='move'; btn.textContent='放！'; $('#cmInfo').innerHTML='爪子移動中…<br>對準獎品按下！'; SFX.coin();
    const t0=performance.now(), sp=.0016+Math.random()*.0008;
    const loop=t=>{ if(claw.phase!=='move') return; claw.x=50+38*Math.sin((t-t0)*sp); setClaw(claw.x,0); claw.raf=requestAnimationFrame(loop); };
    claw.raf=requestAnimationFrame(loop);
  }else if(claw.phase==='move'){
    claw.phase='drop'; btn.disabled=true; cancelAnimationFrame(claw.raf); SFX.tap(); vibrate(10); runDrop();
  }
}
async function runDrop(){
  const x=claw.x, H=($('#glass')?.clientHeight||232)-104;
  await tween(800,k=>setClaw(x,H*k,1));
  let best=-1,bd=99; claw.prizes.forEach((p,i)=>{ if(p.got) return; const dd=Math.abs(p.x-x); if(dd<bd){bd=dd;best=i;} });
  const chance = bd<4?.85:bd<8?.55:bd<11?.2:0;
  await tween(250,k=>setClaw(x,H,1-k));
  const win = best>=0 && Math.random()<chance;
  if(best>=0 && bd<12 && !win){ const el=$('#pz'+best); if(el){ el.classList.add('wig'); setTimeout(()=>el.classList.remove('wig'),450); } }
  let prize=null;
  if(win){ prize=claw.prizes[best]; prize.got=true; const pz=$('#pz'+best); if(pz) pz.style.visibility='hidden'; setEl('#held','textContent',prize.e); }
  await tween(800,k=>setClaw(x,H*(1-k),0));
  if(win){
    const sx=x; await tween(700,k=>setClaw(sx+(8-sx)*k,0,0));
    await tween(200,k=>setClaw(8,0,k)); setEl('#held','textContent','');
    awardPrize(prize);
  }else{ SFX.fail(); setEl('#cmInfo','innerHTML','差一點點！<br>再試一次？'); }
  await tween(500,k=>setClaw((win?8:x)+(50-(win?8:x))*k,0,1));
  claw.phase='idle'; const btn=$('#cmBtn'); if(btn){ btn.disabled=false; btn.textContent='再玩'; }
  if(claw.prizes.every(p=>p.got) || win) setTimeout(()=>{ if(TAB==='park'&&claw.phase==='idle') { const keepInfo=$('#cmInfo')?.innerHTML; setupClaw(); setEl('#cmInfo','innerHTML',keepInfo); } },600);
}
function awardPrize(p){
  S.clawWins++; let msg='';
  if(p.k==='food'){ S.food+=3; msg='🍙 飼料 ×3'; }
  else if(p.k==='coin'){ S.coins+=40; msg='🪙 金幣 ×40'; }
  else if(p.k==='xp'){ addXP(30); msg='⭐ 經驗 +30'; }
  else { const pool=ITEMS.filter(i=>!i.team && !S.owned.includes(i.id) && (i.claw || i.price<=220)); const rare=pool.filter(i=>i.claw);
    const it=(rare.length&&Math.random()<.5)?rare[Math.floor(Math.random()*rare.length)]:pool[Math.floor(Math.random()*pool.length)];
    if(it){ S.owned.push(it.id); msg=`${it.e} ${it.name}${it.claw?'（限定！）':''}`; } else { S.coins+=60; msg='🪙 金幣 ×60'; } }
  checkAch(); save(); SFX.level(); vibrate([20,30,20]); confetti(30);
  setEl('#cmInfo','innerHTML',`🎉 夾到了！<br>${msg}`); toast('夾到了！'+msg,'gold');
  refreshLight();
  setTimeout(runQueue,800);
}

    S.hall.push({name:p.name, form:p.form, gen:S.generation, days:Math.max(1,Math.ceil((Date.now()-p.born)/864e5)), tasks:p.tasks});
    S.generation++; S.pet=newPet(nm); checkAch(); save(); closeSheet(); confetti(80); SFX.level();
    overlay(`<div class="pet">${eggSVG(0)}</div><h2>新的旅程開始了</h2><p class="sub">${esc(nm)} 是第 ${S.generation} 代，經驗值 +${Math.min(50,(S.generation-1)*10)}%</p><button class="btn pri block" data-close style="margin-top:18px">開始照顧</button>`);
  };
}

/* ---- 設定 ---- */
function openSettings(){
  openSheet(`<h3>設定</h3>
    <label class="field"><span>你的名字</span><input id="sName" maxlength="10" value="${esc(S.user.name)}"></label>
    <label class="field"><span>所屬門市</span><select id="sStore">${STORES.map(s=>`<option ${s===S.user.store?'selected':''}>${s}</option>`).join('')}</select></label>
    <div class="field"><span>班別（明天起生效）</span><div class="seg" id="sShift">${Object.entries(SHIFTS).map(([k,v])=>`<button data-v="${k}" class="${S.user.shift===k?'on':''}">${v}</button>`).join('')}</div></div>
    <label class="field"><span>寵物名字</span><input id="sPet" maxlength="8" value="${esc(S.pet.name)}"></label>
    <label class="chk" style="margin-top:16px"><input type="checkbox" id="sSound" ${S.sound?'checked':''}><span>音效</span></label>
    <div class="row"><button class="btn block" id="sReset" style="flex:1;color:var(--warn)">重置資料</button><button class="btn pri block" id="sSave" style="flex:2">儲存</button></div>`);
  let shift=S.user.shift;
  document.querySelectorAll('#sShift button').forEach(b=>b.onclick=()=>{ shift=b.dataset.v; document.querySelectorAll('#sShift button').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#sSave').onclick=()=>{ S.user.name=$('#sName').value.trim()||S.user.name; S.user.store=$('#sStore').value; S.user.shift=shift; S.pet.name=$('#sPet').value.trim()||S.pet.name; S.sound=$('#sSound').checked; save(); closeSheet(); toast('已儲存'); render(); };
  $('#sReset').onclick=()=>{ if(confirm('確定要重置？寵物與所有進度都會消失。')){ localStorage.removeItem(Store.key()); S=null; closeSheet(); render(); } };
}

/* ---- 新手引導 ---- */
function renderOnboarding(step=1, draft={}){
  const app=$('#app');
  if(step===1){
    const name=draft.name||params.get('name')||'', store=draft.store||params.get('store')||'', shift=draft.shift||params.get('shift')||'early';
    app.innerHTML=`<div class="onb"><div class="logo"><div class="p">${petSVG('mochi',{mood:'joy'})}</div><h1>糰糰夥伴</h1><p class="sub">完成門市任務，養大屬於你的夥伴寵物</p></div>
      <label class="field"><span>你的名字</span><input id="oName" maxlength="10" placeholder="例如：小明" value="${esc(name)}"></label>
      <label class="field"><span>所屬門市</span><select id="oStore"><option value="">請選擇門市</option>${STORES.map(s=>`<option ${s===store?'selected':''}>${s}</option>`).join('')}</select></label>
      <div class="field"><span>你的班別</span><div class="seg" id="oShift">${Object.entries(SHIFTS).map(([k,v])=>`<button data-v="${k}" class="${shift===k?'on':''}">${v}</button>`).join('')}</div></div>
      <div class="grow"></div><button class="btn pri block" id="oNext" style="margin-top:24px">下一步</button></div>`;
    let sh=shift;
    document.querySelectorAll('#oShift button').forEach(b=>b.onclick=()=>{ sh=b.dataset.v; document.querySelectorAll('#oShift button').forEach(x=>x.classList.toggle('on',x===b)); });
    $('#oNext').onclick=()=>{ const n=$('#oName').value.trim(), st=$('#oStore').value; if(!n){ toast('請輸入你的名字'); return; } if(!st){ toast('請選擇門市'); return; } renderOnboarding(2,{name:n,store:st,shift:sh}); };
  }else{
    app.innerHTML=`<div class="onb"><div class="logo"><div class="p" style="width:200px;height:200px">${eggSVG(0)}</div><h1 style="font-size:24px">你收到了一顆蛋！</h1><p class="sub">每完成一個門市任務，蛋就會長大一點<br>完成 3 個任務就會孵化</p></div>
      <label class="field"><span>幫牠取個名字</span><input id="oPet" maxlength="8" placeholder="例如：麻糬"></label>
      <div class="card" style="font-size:13px;line-height:1.7"><b>小提醒</b><br>・寵物不會死掉，只是會想你 🥺<br>・你做的任務種類，決定牠進化成什麼樣子<br>・全店一起努力，每週還有團隊獎勵</div>
      <div class="grow"></div><button class="btn pri block" id="oGo" style="margin-top:24px">開始照顧</button></div>`;
    $('#oGo').onclick=()=>{ const pn=$('#oPet').value.trim()||'麻糬'; if(UID==='local') UID='u'+Date.now().toString(36);
      S=newState({uid:UID,name:draft.name,store:draft.store,shift:draft.shift},pn); save(); SFX.ok(); TAB='home'; render();
      setTimeout(()=>toast('到「任務」分頁完成第一個任務吧！'),500); };
  }
}

/* ---------------- 7. INTEGRATION (店務系統串接) ---------------- */
function emit(type,payload){ try{ if(window.parent!==window) window.parent.postMessage({type,...payload},CONFIG.parentOrigin); }catch(e){} }
window.addEventListener('message',e=>{
  if(CONFIG.parentOrigin!=='*' && e.origin!==CONFIG.parentOrigin) return;
  const d=e.data||{}; if(!S) return;
  if(d.type==='mochi:completeTask' && d.code) completeTask(d.code,{external:true});
});
window.MochiPartner = {
  completeTask: code => completeTask(code,{external:true}),
  getState: () => JSON.parse(JSON.stringify(S)),
  todayTasks: () => today().tasks.map(t=>({code:t.code,title:TASK_MAP[t.code].title,done:t.done})),
};

/* ---------------- BOOT ---------------- */
function boot(){
  S=Store.load();
  if(S && params.get('uid') && S.user.uid!==params.get('uid')) S=null;
  if(S){
    if(params.get('name')) S.user.name=params.get('name');
    if(params.get('store')) S.user.store=params.get('store');
    const away=tick(); dailyRollover(); today();
    if(S.pet.stage>0 && away>=20){ S.food+=2; queue(()=>overlay(`<div class="pet">${petSVG(S.pet.form,{mood:'joy'})}</div><h2>歡迎回來！</h2><p class="sub">${esc(S.pet.name)} 好想你～<br>送你回歸禮物 🍙×2</p><button class="btn pri block" data-close style="margin-top:18px">摸摸頭</button>`)); }
    S.lastVisit=dkey(); save();
  }
  render(); setTimeout(runQueue,400);
  setInterval(()=>{ if(!S) return; const before=moodOf(); tick(); save();
    if(TAB==='home' && !ovOpen){ const st=$('#stats'); if(st){ const b=st.querySelectorAll('.bar i'); ['food','fun','clean','energy'].forEach((k,i)=>{ b[i].style.width=Math.round(S.pet.stats[k])+'%'; }); } if(before!==moodOf()) renderHome(); }
  }, 20000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S){ tick(); dailyRollover(); render(); } });
}
boot();
</script>
